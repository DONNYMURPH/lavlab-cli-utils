name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner -- must match the arm64 target
    timeout-minutes: 180 # Nuitka's C compilation is slow (~1600 files)
    permissions:
      contents: write

    strategy:
      fail-fast: false   # if 3.11 fails, still try 3.12 (and vice versa)
      matrix:
        include:
          - python-version: "3.11"
            ice-wheel: "zeroc_ice-3.6.5-cp311-cp311-macosx_11_0_universal2.whl"
          - python-version: "3.12"
            ice-wheel: "zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore Nuitka ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
          key: nuitka-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('build-requirements.txt', 'build_native.py', 'setup.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Download zeroc-ice wheel from Glencoe
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/${ICE_RELEASE_TAG}/${{ matrix.ice-wheel }}"
          ls -lh ${{ matrix.ice-wheel }}
        env:
          ICE_RELEASE_TAG: "20240131"

      - name: Install zeroc-ice and omero-py
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ${{ matrix.ice-wheel }}
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"

      - name: Install build requirements
        run: pip install -r build-requirements.txt

      - name: Build the wheel
        run: python setup.py bdist_wheel

      - name: Show what was built
        run: ls -lh dist/ lavlab/bin/

      - name: Stage the standalone dist
        run: |
          tar -C lavlab/bin -czf \
            dist/lavlab-macos-arm64-py${{ matrix.python-version }}.tar.gz dist
          ls -lh dist/

      - name: Smoke test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/lavlab-smoke
          /tmp/lavlab-smoke/bin/pip install dist/*.whl
          out=$(/tmp/lavlab-smoke/bin/lavlab --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
          for sub in lr roi geojson seg meta; do
            subout=$(/tmp/lavlab-smoke/bin/lavlab "$sub" --help) || exit 1
            [ -n "$subout" ] || { echo "$sub --help produced no output"; exit 1; }
          done

      - name: Smoke test the standalone binary directly
        # No venv, no pip -- just run the compiled artifact on its own.
        run: |
          chmod +x lavlab/bin/dist/lavlab-bin
          out=$(./lavlab/bin/dist/lavlab-bin --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac

      - name: Upload wheel as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload standalone dist as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-dist-py${{ matrix.python-version }}
          path: dist/lavlab-macos-arm64-py${{ matrix.python-version }}.tar.gz
          if-no-files-found: error

      - name: Attach wheel and dist to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/lavlab-macos-arm64-py*.tar.gz
          fail_on_unmatched_files: true

  build-linux:
    runs-on: ubuntu-24.04 
    timeout-minutes: 180
    permissions:
      contents: write
      packages: write 

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            ice-wheel: "zeroc_ice-3.6.5-cp311-cp311-manylinux_2_28_x86_64.whl"
          - python-version: "3.12"
            ice-wheel: "zeroc_ice-3.6.5-cp312-cp312-manylinux_2_28_x86_64.whl"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install gcc/build tooling
        run: sudo apt-get update && sudo apt-get install -y build-essential ccache

      - name: Restore Nuitka ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/Nuitka
            ~/.cache/ccache
          key: nuitka-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('build-requirements.txt', 'build_native.py', 'setup.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Download zeroc-ice wheel from Glencoe (Linux x86_64)
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/zeroc-ice-py-linux-x86_64/releases/download/${ICE_RELEASE_TAG}/${{ matrix.ice-wheel }}"
          ls -lh ${{ matrix.ice-wheel }}
        env:
          ICE_RELEASE_TAG: "20240202"

      - name: Install zeroc-ice and omero-py
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ${{ matrix.ice-wheel }}
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"

      - name: Install build requirements
        run: pip install -r build-requirements.txt

      - name: Build the wheel
        run: python setup.py bdist_wheel

      - name: Show what was built
        run: ls -lh dist/ lavlab/bin/

      - name: Stage the standalone dist
        run: |
          tar -C lavlab/bin -czf \
            dist/lavlab-linux-x86_64-py${{ matrix.python-version }}.tar.gz dist
          ls -lh dist/

      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Dockerfile.runtime build context
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        run: cp -r lavlab/bin/dist lavlab-dist

      - name: Build and push runtime image to GHCR
        if: startsWith(github.ref, 'refs/tags/') && matrix.python-version == '3.11'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          push: true
          tags: |
            ghcr.io/donnymurph/lavlab-cli-utils:${{ github.ref_name }}
            ghcr.io/donnymurph/lavlab-cli-utils:latest

      - name: Smoke test the wheel in a clean virtualenv
        run: |
          python -m venv /tmp/lavlab-smoke
          /tmp/lavlab-smoke/bin/pip install dist/*.whl
          out=$(/tmp/lavlab-smoke/bin/lavlab --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac
          for sub in lr roi geojson seg meta; do
            subout=$(/tmp/lavlab-smoke/bin/lavlab "$sub" --help) || exit 1
            [ -n "$subout" ] || { echo "$sub --help produced no output"; exit 1; }
          done

      - name: Smoke test the standalone binary directly
        run: |
          chmod +x lavlab/bin/dist/lavlab-bin
          out=$(./lavlab/bin/dist/lavlab-bin --help) || exit 1
          [ -n "$out" ] || { echo "--help produced no output"; exit 1; }
          case "$out" in usage:*) ;; *) echo "unexpected --help output"; exit 1 ;; esac

      - name: Upload wheel as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-wheel-linux-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload standalone dist as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-dist-linux-py${{ matrix.python-version }}
          path: dist/lavlab-linux-x86_64-py${{ matrix.python-version }}.tar.gz
          if-no-files-found: error

      - name: Attach wheel and dist to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/lavlab-linux-x86_64-py*.tar.gz
          fail_on_unmatched_files: true
