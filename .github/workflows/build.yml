name: Build wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner -- must match the arm64 target
    timeout-minutes: 90 # Nuitka's C compilation is slow (~1600 files)

    strategy:
      fail-fast: false   # if 3.11 fails, still try 3.12 (and vice versa)
      matrix:
        include:
          - python-version: "3.11"
            ice-wheel: "zeroc_ice-3.6.5-cp311-cp311-macosx_11_0_universal2.whl"
          - python-version: "3.12"
            ice-wheel: "zeroc_ice-3.6.5-cp312-cp312-macosx_11_0_universal2.whl"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore Nuitka ccache
        # A cold cache costs ~60 minutes of C compilation; a warm one is far
        # faster. Keyed so a changed build config starts fresh, but ordinary
        # source edits still reuse the cache.
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/Nuitka
            ~/.cache/ccache
          key: nuitka-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('build-requirements.txt', 'build_native.py', 'setup.py') }}
          restore-keys: |
            nuitka-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Download zeroc-ice wheel from Glencoe
        # -O keeps the original filename; pip rejects renamed wheels because it
        # parses metadata out of the filename itself.
        run: |
          curl -fL -O \
            "https://github.com/glencoesoftware/zeroc-ice-py-macos-universal2/releases/download/${ICE_RELEASE_TAG}/${{ matrix.ice-wheel }}"
          ls -lh ${{ matrix.ice-wheel }}
        env:
          ICE_RELEASE_TAG: "20240131"

      - name: Install zeroc-ice and omero-py
        # `wheel` and `setuptools` are needed for `setup.py bdist_wheel` -- conda
        # provides them locally, but a bare setup-python runner does not.
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ${{ matrix.ice-wheel }}
          pip install omero-py==5.21.0
          python -c "import omero.gateway, Ice; print('Ice', Ice.stringVersion())"

      - name: Install build requirements
        run: pip install -r build-requirements.txt

      - name: Install zstandard for onefile compression
        # Without this, Nuitka warns "Onefile mode cannot compress" and the
        # payload ships uncompressed -- roughly 50MB larger.
        run: pip install zstandard

      - name: Build the wheel
        run: python setup.py bdist_wheel

      - name: Show what was built
        run: ls -lh dist/ lavlab/bin/

      - name: Stage the standalone binary
        # Both matrix jobs produce a file called `lavlab-bin`, so give each a
        # distinct name or they collide as release assets.
        run: |
          cp lavlab/bin/lavlab-bin \
             dist/lavlab-bin-macos-arm64-py${{ matrix.python-version }}
          ls -lh dist/

      - name: Smoke test the wheel in a clean virtualenv
        # Install into an environment with nothing else in it -- this is the
        # actual promise of the project (pip install and it works, no setup).
        run: |
          python -m venv /tmp/lavlab-smoke
          /tmp/lavlab-smoke/bin/pip install dist/*.whl
          /tmp/lavlab-smoke/bin/lavlab --help
          /tmp/lavlab-smoke/bin/lavlab lr --help
          /tmp/lavlab-smoke/bin/lavlab roi --help
          /tmp/lavlab-smoke/bin/lavlab geojson --help
          /tmp/lavlab-smoke/bin/lavlab seg --help
          /tmp/lavlab-smoke/bin/lavlab meta --help

      - name: Smoke test the standalone binary directly
        # No venv, no pip -- just run the compiled artifact on its own.
        run: |
          chmod +x dist/lavlab-bin-macos-arm64-py${{ matrix.python-version }}
          ./dist/lavlab-bin-macos-arm64-py${{ matrix.python-version }} --help

      - name: Upload wheel as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload standalone binary as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lavlab-bin-py${{ matrix.python-version }}
          path: dist/lavlab-bin-macos-arm64-py${{ matrix.python-version }}
          if-no-files-found: error

      - name: Attach wheel and binary to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/lavlab-bin-macos-arm64-py*
          fail_on_unmatched_files: true
